name: Windows Installer

on:
  push:
    branches:
      - develop
      - feature/sprint-18-production-hardening
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Resolve application version
        shell: powershell
        run: |
          $build = Get-Content .\build.gradle -Raw
          if ($build -notmatch "version\s*=\s*'([^']+)'") {
            throw "No se pudo determinar la versión desde build.gradle."
          }
          "APP_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and test
        shell: powershell
        run: .\gradlew.bat clean build --no-daemon

      - name: Ensure WiX Toolset
        shell: powershell
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            $wixRoot = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wixRoot) {
              throw "No se encontró WiX Toolset después de instalarlo."
            }
            $wixBin = Join-Path $wixRoot.FullName "bin"
            $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Generate SisTienda EXE
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build-windows-installer.ps1 -SkipTests

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SisTienda-Windows-${{ env.APP_VERSION }}
          path: app-ui/build/installer/*.exe
          if-no-files-found: error
          retention-days: 14
